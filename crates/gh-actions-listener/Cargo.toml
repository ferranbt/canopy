[package]
name = "gh-actions-listener"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The protocol a self-hosted GitHub Actions runner speaks to GitHub"

[dependencies]
gh-actions-context.workspace = true
gh-actions-encoding.workspace = true
gh-actions-expr.workspace = true
gh-actions-report.workspace = true
gh-actions-spec.workspace = true
serde = { workspace = true }
serde_json = "1.0"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "form", "rustls", "webpki-roots"] }
rsa = { version = "0.9", features = ["sha2"] }
aes = "0.8"
cipher = "0.4"
cbc = { version = "0.1", features = ["alloc"] }
rand = "0.8"
sha1 = "0.10"
sha2 = "0.10"
jsonwebtoken = "9"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tungstenite = { version = "0.24", default-features = false, features = ["rustls-tls-webpki-roots", "handshake"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
axum = "0.8"
serde_path_to_error = "0.1.20"
