name: Release

on:
  schedule:
    - cron: "0 3 * * 1"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to
        required: true
        type: choice
        default: staging
        options: [staging, production]
      dry-run:
        description: Skip publishing
        required: false
        type: boolean
        default: false

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: rust:1.90-bookworm
      env:
        CARGO_HOME: /cargo
      volumes:
        - /cache:/cargo
      options: --cpus 2
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    services:
      postgres:
        image: postgres:16
        ports: [5432]
        env:
          POSTGRES_PASSWORD: postgres
      redis: redis:7
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release

  publish:
    needs: build
    environment:
      name: ${{ inputs.environment }}
      url: https://example.com
    permissions:
      contents: write
      id-token: write
    concurrency: publish
    runs-on:
      group: deploy-runners
      labels: [linux, x64]
    steps:
      - uses: actions/checkout@v4
      - name: Publish
        if: ${{ !inputs.dry-run }}
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
