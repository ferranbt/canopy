# Container actions: one built from a Dockerfile, one straight from an image.
name: Docker actions

on: push

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - id: greet
        uses: ./actions/greet-docker
        with:
          who-to-greet: docker
      - name: Read the container's output
        run: echo "container said ${{ steps.greet.outputs.greeted-by }}"

      - name: Run a published image directly
        uses: docker://alpine:3.19

  state:
    runs-on: ubuntu-latest
    steps:
      - id: state
        uses: ./actions/state-docker

      - name: What the container wrote comes back
        run: |
          test "${{ steps.state.outputs.wrote-state }}" = "yes"
          test "$FROM_CONTAINER" = "yes"
          echo "the container reached every state file"
