# A container action built from a Dockerfile, and a published image run straight.
name: Docker actions

on: push

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - id: greet
        uses: ./actions/greet-docker
        with:
          who-to-greet: docker
      - name: Read the container's output
        run: echo "container said ${{ steps.greet.outputs.greeted-by }}"

      - name: Run a published image directly
        uses: docker://alpine:3.19
