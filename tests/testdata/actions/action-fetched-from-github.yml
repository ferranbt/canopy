# An action fetched from GitHub and cached locally.
name: Remote action

on: push

jobs:
  remote:
    runs-on: ubuntu-latest
    steps:
      - id: greet
        uses: actions/hello-world-javascript-action@main
        with:
          who-to-greet: canopy

      - name: What the fetched action returned
        uses: ./actions/expect
        with:
          checks: |
            ${{ steps.greet.outcome }} == success                     # it was fetched, and it ran
            ${{ steps.greet.outputs.time != '' }} == true             # and it returned what it declares
