name: Only the services a job asked for

on: push

jobs:
  one-service-and-no-others:
    runs-on: ubuntu-latest
    container: debian:bookworm-slim
    services:
      cache:
        image: redis:7-alpine

    steps:
      - name: The one it asked for is there
        shell: bash
        run: |
          for attempt in $(seq 30); do
            (exec 3<>/dev/tcp/cache/6379) 2>/dev/null && break
            sleep 1
          done

          exec 3<>/dev/tcp/cache/6379
          printf 'PING\r\n' >&3
          head -c 7 <&3 | grep -q PONG
          echo "cache answered"

      - name: A name it did not ask for is not
        run: |
          if getent hosts other; then
            echo "other should not resolve in a job that never asked for it"
            exit 1
          fi
          echo "other did not resolve"

      - name: Nor is the name of an image it happens to run
        run: |
          if getent hosts redis; then
            echo "redis should not resolve either: the label is the name"
            exit 1
          fi
          echo "redis did not resolve"
