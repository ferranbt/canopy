# A value a step masks is hidden from the log for the rest of the job.
#
# A workflow cannot check this about itself: the step sees its own output unmasked, and the
# hiding happens on the way out through the runner. What this file asserts is that masking
# does not disturb the step; that the secret is absent from the log is asserted by
# `crates/canopy/tests/output.rs`, which reads what the binary actually printed.
name: Secret masking

on: push

jobs:
  masks-a-value:
    runs-on: ubuntu-latest
    env:
      TOKEN: hunter2-not-a-real-secret
    steps:
      - name: Ask for it to be masked, then print it
        run: |
          echo "::add-mask::$TOKEN"
          echo "the token is $TOKEN"

      - name: A later step in the same job is masked too
        run: |
          echo "still $TOKEN"
          # The step itself still sees the real value; only the log is hidden.
          test "$TOKEN" = hunter2-not-a-real-secret

      - name: Masking reaches standard error as well
        run: echo "on stderr: $TOKEN" >&2
