# The three kinds of action, all resolved from this repository.
name: Local actions

on: push

jobs:
  composite:
    runs-on: ubuntu-latest
    steps:
      - id: greet
        uses: ./actions/greet-composite
        with:
          who-to-greet: composite
          greeting: Hey
      - name: Read the action's output
        run: echo "action returned ${{ steps.greet.outputs.message }}"

      - name: Defaults are filled in when `with` is omitted
        uses: ./actions/greet-composite

  node:
    runs-on: ubuntu-latest
    steps:
      - id: greet
        uses: ./actions/greet-node
        with:
          who-to-greet: node
      - name: Outputs and env from a JavaScript action
        run: echo "output=${{ steps.greet.outputs.greeted-at }} env=$GREETED_BY"
