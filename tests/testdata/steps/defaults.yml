# `defaults.run` sets the shell and working directory for every `run:` step under it, with
# the job overriding the workflow and a step overriding both.
name: Defaults

on: push

defaults:
  run:
    shell: sh
    working-directory: from-workflow

jobs:
  a_job_overrides_the_workflow:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: from-job
    steps:
      - name: Make the directories the defaults point at
        # Back at the workspace root, since the other defaults point at directories this
        # step is about to create.
        working-directory: .
        run: mkdir -p from-workflow from-job from-step

      - name: The job's defaults win
        run: |
          test "$(basename "$PWD")" = from-job
          test -n "$BASH_VERSION"
          echo "job defaults applied"

      - name: A step wins over both
        shell: sh
        working-directory: from-step
        run: |
          test "$(basename "$PWD")" = from-step
          test -z "$BASH_VERSION"
          echo "step settings applied"
