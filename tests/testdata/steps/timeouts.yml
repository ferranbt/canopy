# A step that outstays its `timeout-minutes` is killed. Without this the sleep below would
# never end and the suite would hang on it, which is the whole point of the field.
#
# `timeout-minutes` is counted in whole minutes, so this costs a minute of real waiting.
# One case earns that; the rest of the behaviour is the same code path.
name: Timeouts

on: push

jobs:
  step-timeout:
    runs-on: ubuntu-latest
    # A job deadline bounds every step under it, so this is exercised by the steps below
    # even though none of them reaches it.
    timeout-minutes: 30
    steps:
      - name: A step that takes longer than it is allowed
        id: overrun
        timeout-minutes: 1
        # Without this the job would end here, which is what happens when a step runs out
        # of time and has no excuse.
        continue-on-error: true
        run: sleep 400

      - name: The step was killed rather than left running
        run: |
          echo "outcome=${{ steps.overrun.outcome }}"
          test "${{ steps.overrun.outcome }}" = failure

      - name: A step within its time is untouched
        timeout-minutes: 5
        run: |
          sleep 1
          echo "finished in good time"
