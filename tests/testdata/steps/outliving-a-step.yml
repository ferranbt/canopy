name: What outlives a step

on: push

jobs:
  left-running:
    runs-on: ubuntu-latest
    steps:
      - name: A step that leaves something behind it
        run: |
          rm -f orphan.txt
          nohup sh -c 'sleep 3; echo "the one left behind finished" > orphan.txt' >/dev/null 2>&1 &
          echo "the step itself is done"

      - name: What became of it
        run: |
          for attempt in $(seq 30); do
            [ -f orphan.txt ] && break
            sleep 1
          done
          echo "left behind: [$(cat orphan.txt 2>/dev/null)]"

      - name: One that is killed while something of its own is running
        timeout-minutes: 1
        continue-on-error: true
        run: |
          rm -f killed.txt
          nohup sh -c 'sleep 90; echo "outlived the step that was killed" > killed.txt' >/dev/null 2>&1 &
          echo "waiting to be killed"
          sleep 400

      - name: Whether what it left is still going
        run: |
          if ps -eo args | grep -q "[s]leep 90"; then
            echo "still going"
          else
            echo "gone with the step"
          fi
