# What a step says on stdout that the runner is meant to act on: the path it adds to, and
# the levels it raises.
#
# No `::notice::` here: the runner GitHub ships takes it and leaves nothing behind — not a
# line in the log, not an issue on the step — so there is nothing to hold a run to.
name: Workflow commands

on: push

jobs:
  adds-to-the-path:
    runs-on: ubuntu-latest
    steps:
      - name: Put a command somewhere and add it to the path
        run: |
          mkdir -p tools
          printf '#!/bin/sh\necho "found on the path"\n' > tools/greet
          chmod +x tools/greet
          echo "$PWD/tools" >> "$GITHUB_PATH"

      - name: The next step finds it by name alone
        run: |
          greet | grep -q "found on the path"
          echo "the path carried over"

      - name: Ordinary commands still resolve
        run: |
          # Adding to the path must not cost us what was already there.
          command -v bash >/dev/null
          command -v grep >/dev/null
          echo "the rest of the path survived"

      - name: Group some lines and raise the two levels
        run: |
          echo "::group::a group of lines"
          echo "inside the group"
          echo "::endgroup::"
          echo "::warning::something worth watching"
          echo "::error::something that went wrong"
          echo "said everything"

      - name: The summary file is there and can be written
        run: |
          echo "## What happened" >> "$GITHUB_STEP_SUMMARY"
          echo "a line about it" >> "$GITHUB_STEP_SUMMARY"
          # Each step gets its own, so a step can read back what it wrote.
          grep -q "What happened" "$GITHUB_STEP_SUMMARY"
          echo "wrote a summary"
